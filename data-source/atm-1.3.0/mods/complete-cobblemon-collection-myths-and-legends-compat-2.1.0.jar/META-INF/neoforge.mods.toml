# neoforge.mods.toml -- NeoForge loading metadata. Placeholder values are expanded from
# gradle.properties by the generateModMetadata task in build.gradle. Kept in sync with the
# fabric.mod.json alongside it so the same jar loads on both loaders (and as a raw data pack).

# The mod loader type to load - for regular FML @Mod mods it should be javafml.
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version.
loaderVersion="[1,)" #mandatory

# The license for the mod.
license="LicenseRef-All-Rights-Reserved"

# This mod bundles its assets directly, so they load as part of the mod rather than appearing as a
# separate, toggleable resource pack in the resource pack menu.
showAsResourcePack=false

# A URL to refer people to when problems occur with this mod.
issueTrackerURL="https://github.com/Complete-Cobblemon-Collection-Team/datapack/issues"

[[mods]] #mandatory
    # The modid of the mod.
    modId="mr_complete_cobblemoncollectionmythsandlegendscompat" #mandatory
    # The version number of the mod.
    version="2.1.0" #mandatory
    # A display name for the mod.
    displayName="Complete Cobblemon Collection - Myths and Legends compat" #mandatory
    # A file name (in the root of the mod JAR) containing a logo for display.
    logoFile="pack.png"
    # A URL to query for updates for this mod. See https://docs.neoforged.net/docs/misc/updatechecker/
    updateJSONURL="https://api.modrinth.com/updates/qoL4kNxC/forge_updates.json?neoforge=only"
    # A URL for the "homepage" for this mod, displayed in the mod UI.
    displayURL="https://modrinth.com/datapack/complete-cobblemon-collection-myths-and-legends-compat"
    # A text field displayed in the mod UI.
    credits="Generated by Modrinth"
    # The authors of the mod, displayed in the mod UI.
    authors="DefaultCube, Xcavalier, ASHISK, Wi2tert, Raspix, NetImmerse, Genotype, marcustars, BlaziumHydro, kylbrez, RedRibbonz, YaBoiBruno, El-Pigeon, aki4hiro, nady3, RedGenesectNinja, Tontra, Bwavii, VLFive, tazzy989, Valee_Valee, JoeSeff, .zalno, fire_jaguar, Quacctastic, alloneF, Beezy, ya_hrim, bonanca, planetacobblemon, DiEn212, Hermes28"
    # The description text for the mod.
    description="The Largest Cobblemon Addon Pack that gives Models, Spawns and Animations for EVERY SINGLE POKEMON."

# The pack's content targets Cobblemon, so require it and load after it.
[[dependencies.mr_complete_cobblemoncollectionmythsandlegendscompat]]
    modId="cobblemon"
    type="required"
    versionRange="[1.7.3+1.21.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.mr_complete_cobblemoncollectionmythsandlegendscompat]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mr_complete_cobblemoncollectionmythsandlegendscompat]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"
